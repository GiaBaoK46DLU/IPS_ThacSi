[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uji-ips-mixers"
version = "0.1.0"
description = "Reproducible Wi-Fi IPS with MLP, MLP-Mixer and RSSI-KAN-Mixer"
requires-python = ">=3.9"
dependencies = ["numpy", "scikit-learn", "torch", "psutil", "matplotlib"]

[project.scripts]
ips = "ips.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ips.models.vendor" = ["*.json", "LICENSE.*"]
